<style>
:root{
  --bg:#f3f5fa; --card:#ffffff; --ink:#16213a; --muted:#5a6580; --line:#e1e6f0;
  --brand:#143882; --brand-dark:#0d2763; --brand-ink:#ffffff; --gold:#f4ca1b; --gold-soft:#e6e27b; --gold-ink:#7a5d00; --ok:#1f7a4d; --ok-bg:#e5f4ec;
  --err:#b3261e; --err-bg:#fbe9e7; --warn-bg:#fff4dc;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
button,input,select{font:inherit}
.topo{background:#fff;color:var(--ink);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:4px solid var(--gold);box-shadow:0 1px 0 var(--gold-soft)}
.topo .marca{display:flex;align-items:center;gap:12px;line-height:1.15}
.topo .marca img{height:40px;width:auto;display:block}
.topo .marca .txt{display:flex;flex-direction:column;border-left:1px solid var(--line);padding-left:12px}
.topo .marca b{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:17px;color:var(--brand)}
.topo .marca span{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.topo button{background:#fff;border:1px solid var(--line);color:var(--brand);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer}
.logo-grande{display:block;width:min(240px,70%);height:auto;margin:4px auto 18px}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
h1{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:24px;letter-spacing:-.01em;color:var(--brand);margin:0 0 6px}
h2{font-size:18px;margin:0 0 12px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}
label{display:block;font-size:14px;font-weight:500;margin:12px 0 6px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff}
.btn.full{width:100%;margin-top:16px}
.btn.sec{background:#fff;color:var(--brand);border:1px solid var(--line)}
.btn:not(.sec):not(.perigo):hover{background:var(--brand-dark)}
.btn.perigo{background:#fff;color:var(--err);border:1px solid #efc7c2}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;color:var(--brand);text-decoration:underline;cursor:pointer;padding:0}
.abas{display:flex;gap:6px;margin-bottom:16px;background:#e6ebf5;padding:4px;border-radius:12px}
.abas button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.abas button.on{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.aviso{border-radius:10px;padding:12px 14px;margin:12px 0;font-size:15px}
.aviso.ok{background:var(--ok-bg);color:var(--ok)}
.aviso.err{background:var(--err-bg);color:var(--err)}
.aviso.warn{background:#fff8d6;color:var(--gold-ink);border-left:4px solid var(--gold)}
.resultado{text-align:center;padding:36px 20px}
.resultado .icone{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;font-size:40px;font-weight:700}
.resultado.ok .icone{background:var(--ok-bg);color:var(--ok)}
.resultado.err .icone{background:var(--err-bg);color:var(--err)}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lista li:last-child{border-bottom:0}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#e6ebf5;color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.ao-vivo{background:#fde8e6;color:var(--err)}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:#f7f9fd;border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:28px;font-family:Montserrat,Inter,sans-serif;font-weight:800;color:var(--brand)}
.barra{height:8px;background:#e6ebf5;border-radius:99px;overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;background:var(--gold)}
.tabela-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff}
th{font-weight:600;color:var(--muted);font-size:12px}
td.p{color:var(--ok);font-weight:700}
td.f{color:#c3cad8}
/* Tela da aula ao vivo */
.ao-vivo-tela{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 0%,#1d4aa6 0%,var(--brand) 45%,var(--brand-dark) 100%);color:#fff;display:flex;flex-direction:column;z-index:10;overflow:auto}
.ao-vivo-tela header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px}
.ao-vivo-tela header h1{color:#fff;font-size:24px;margin:0}
.ao-vivo-tela header .rotulo{color:var(--gold);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.qr-box .logo-qr{display:block;height:42px;width:auto;margin:0 auto 10px}
.ao-vivo-tela .corpo{flex:1;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:center;padding:8px 20px 24px}
.qr-box{background:#fff;border-radius:20px;padding:18px;border-bottom:6px solid var(--gold);width:min(78vmin,460px)}
.qr-box #qr{width:100%;aspect-ratio:1;display:grid;place-items:center}
.qr-box #qr img,.qr-box #qr svg{width:100%;height:auto;display:block}
.contagem{height:6px;background:#e6ebf5;border-radius:99px;overflow:hidden;margin-top:12px}
.contagem i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.painel{min-width:240px;max-width:360px;flex:1}
.painel .numero{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:68px;line-height:1;color:var(--gold)}
.painel ul{list-style:none;padding:0;margin:12px 0 0;max-height:40vh;overflow:auto}
.painel li{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:15px}
.ao-vivo-tela .btn.sec{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)}
.ao-vivo-tela .instrucao{opacity:.8;font-size:15px;margin-top:10px;text-align:center;color:#1b1f2a}
.oculto{display:none!important}
/* ===== Abas roláveis ===== */
.abas{overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{flex:1 0 auto;white-space:nowrap;padding:10px 14px}
/* ===== Resumo e frequência ===== */
.resumo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.resumo-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.resumo-box span{font-size:12.5px;color:var(--muted)}
.resumo-box b{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:26px;color:var(--brand);line-height:1.15}
.resumo-box b.menor{font-size:16px;line-height:1.3}
.resumo-box small{font-size:12px;color:var(--muted)}
.resumo-box.bom{border-color:#b7e0c8;background:var(--ok-bg)}
.resumo-box.bom b{color:var(--ok)}
.resumo-box.baixo{border-color:#efc7c2;background:var(--err-bg)}
.resumo-box.baixo b{color:var(--err)}
.resumo-box.destaque{border:2px solid var(--gold);background:#fff8d6}
.card .resumo{margin:14px 0}
@media (max-width:560px){.resumo{grid-template-columns:1fr}}
.barra{position:relative}
.barra u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;text-decoration:none}
.stat > span{display:block}
.stat.bom .barra i{background:var(--ok)}
.stat.baixo .barra i{background:var(--err)}
.stat.baixo b{color:var(--err)}
.selo-freq{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px}
.stat.bom .selo-freq{background:var(--ok-bg);color:var(--ok)}
.stat.baixo .selo-freq{background:var(--err-bg);color:var(--err)}
.pill.falta{background:var(--err-bg);color:var(--err)}
td.pct-baixo{color:var(--err)}
td.pct-bom{color:var(--ok)}
/* ===== Janelas ===== */
.modal.largo{max-width:540px;text-align:left;max-height:88vh;display:flex;flex-direction:column;padding:0}
.janela-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 10px;border-bottom:1px solid var(--line)}
.janela-topo h2{margin:0}
.janela-corpo{padding:14px 20px 20px;overflow:auto}
.janela-corpo .modal-detalhe{margin-bottom:12px;text-align:left}
.fechar{background:none;border:0;font-size:28px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
.duas-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* ===== Pessoas ===== */
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.mini-select{width:auto;padding:7px 10px;font-size:13px;border-radius:8px}
/* ===== Farol de Módulos ===== */
.farol-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.farol-cab h1{margin-bottom:2px}
.farol-barra{display:grid;grid-template-columns:repeat(auto-fit,minmax(6px,1fr));gap:3px;margin:4px 0 8px}
.farol-barra i{height:12px;border-radius:2px;background:#fff;border:1px solid #b9c1d0}
.farol-barra i.ok{background:var(--brand);border-color:var(--brand)}
.farol-barra i.agora{background:var(--gold);border-color:var(--gold)}
.legenda{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);margin:0 0 6px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1.5px solid #b9c1d0}
.sw.ok{background:var(--brand);border-color:var(--brand)}
.sw.agora{background:#fff8d6;border:2px solid var(--gold)}
.sw.todo{border-style:dashed}
.farol-ano{border-top:1px solid var(--line);padding:16px 0 4px;margin-top:14px}
.farol-ano-tit{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.farol-ano-tit h2{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:24px;color:var(--brand);margin:0}
.farol-ano-tit span{font-size:13px;color:var(--muted)}
.farol-trilha{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.farol-bim{border-radius:12px;padding:10px 11px;border:1.5px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:6px}
.farol-bim-topo{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.farol-bim .per{font-weight:700;font-size:13.5px}
.farol-bim .tag{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px}
.farol-bim ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.farol-bim.ok{background:#eaf1fd;border-color:transparent}
.farol-bim.ok .tag{background:var(--brand);color:#fff}
.farol-bim.agora,.farol-bim.proximo{background:#fff8d6;border:2px solid var(--gold)}
.farol-bim.agora .tag,.farol-bim.proximo .tag{background:var(--gold);color:#1b1b1b}
.farol-bim.todo{border-style:dashed;border-color:#b9c1d0}
.farol-bim.todo .per{color:var(--muted)}
.farol-disc{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;border-radius:8px;padding:4px 6px;margin:0 -6px;font-size:13.5px;line-height:1.25}
.farol-disc:hover,.farol-disc:focus-visible{background:rgba(20,56,130,.08)}
.farol-disc small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.farol-seq{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.farol-seq summary{cursor:pointer;font-weight:700;color:var(--brand)}
.farol-seq ol{list-style:none;padding:0;margin:10px 0 0;columns:2 260px;column-gap:24px}
.farol-seq li{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:5px 0;border-top:1px solid var(--line);font-size:13.5px;break-inside:avoid}
.farol-seq .num{font-weight:700;color:var(--muted)}
.farol-seq li.ok .num{color:var(--brand)}
.farol-seq small{display:block;font-size:11.5px;color:var(--brand)}
.farol-seq small.agora{color:#8a6500}
main{max-width:860px}

.btn.mini{padding:8px 12px;font-size:13px}
.btn.vermelho{background:var(--err);color:#fff}
.btn.vermelho:hover{background:#8f1d17}
.modal-fundo{position:fixed;inset:0;background:rgba(13,39,99,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}
.modal h2{color:var(--ink);font-size:19px;margin:0 0 10px}
.modal p{color:var(--muted);font-size:15px}
.modal-icone{width:52px;height:52px;border-radius:50%;background:var(--err-bg);color:var(--err);display:grid;place-items:center;font-size:28px;font-weight:800;margin:0 auto 14px}
.modal-detalhe{background:#f3f5fa;border-radius:10px;padding:10px 12px;font-weight:600;color:var(--brand);margin:0 0 18px}
.modal-botoes{display:flex;gap:10px}
.modal-botoes .btn{flex:1}
.btn.copiado{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}
.acoes-aluno{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.card .card{margin:12px 0 0}
.pix-card{border-top:6px solid var(--gold)}
.pix-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.pix-selo{background:var(--brand);color:#fff;font-weight:700;font-family:Montserrat,Inter,sans-serif;padding:6px 16px;border-radius:999px;font-size:15px}
.pix-logo{height:34px;width:auto}
.pix-rotulo{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-top:4px}
.pix-titular{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:22px;color:var(--brand);line-height:1.25;margin:2px 0 12px}
.pix-banco{font-weight:600;margin:2px 0 12px}
.pix-chave{background:#eaf1fd;border-radius:12px;padding:14px 16px;margin:4px 0 6px}
.pix-num{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:26px;color:var(--brand);letter-spacing:.01em;word-break:break-all}
.carregando{text-align:center;padding:60px 0;color:var(--muted)}
</style>
</head>

<script>
/* ===== Configuração ===== */
const SUPABASE_URL = "https://juayaeiyvmwteqgssfhx.supabase.co";
const LOGO = document.querySelector(".topo img").src;
const SUPABASE_KEY = "sb_publishable_j4wJGZdJKAeNchELx-6peQ_smN2bgjP";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===== Utilidades ===== */
const $app = document.getElementById("app");
const btnSair = document.getElementById("btnSair");
function el(tag, attrs = {}, ...filhos) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const f of filhos.flat()) if (f != null && f !== false) n.append(f instanceof Node ? f : document.createTextNode(String(f)));
  return n;
}
function tela(...filhos) { $app.replaceChildren(...filhos.flat().filter(f => f != null && f !== false)); window.scrollTo(0, 0); }
function aviso(tipo, texto) { return el("div", { class: "aviso " + tipo }, texto); }
function fmtData(d) { const [a, m, dia] = d.split("-"); return `${dia}/${m}/${a}`; }
function fmtHora(t) { return new Date(t).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
function pegarStorage(k) { try { return localStorage.getItem(k); } catch { return null; } }
function guardarStorage(k, v) { try { localStorage.setItem(k, v); } catch {} }
function sessaoGet(k) { try { return sessionStorage.getItem(k); } catch { return null; } }
function sessaoSet(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} }

// Identificador deste celular (fica salvo no navegador)
function aparelhoId() {
  let id = pegarStorage("freq_aparelho");
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)) + "-" + Math.random().toString(36).slice(2, 8);
    guardarStorage("freq_aparelho", id);
  }
  return id;
}

/* ===== Estado ===== */
let perfil = null;
let pararAoVivo = null;

/* ===== Check-in vindo do QR ===== */
(function capturarQR() {
  const q = new URLSearchParams(location.search);
  if (q.get("aula") && q.get("t")) {
    sessaoSet("freq_checkin", JSON.stringify({ aula: q.get("aula"), t: q.get("t"), em: Date.now() }));
    history.replaceState(null, "", location.pathname);
  }
})();

/* ===== CPF ===== */
function soDigitos(v) { return String(v || "").replace(/\D/g, ""); }
function fmtCpf(v) {
  const d = soDigitos(v).slice(0, 11);
  let o = d.slice(0, 3);
  if (d.length > 3) o += "." + d.slice(3, 6);
  if (d.length > 6) o += "." + d.slice(6, 9);
  if (d.length > 9) o += "-" + d.slice(9);
  return o;
}
function cpfValido(c) {
  if (!/^\d{11}$/.test(c) || /^(\d)\1{10}$/.test(c)) return false;
  const dv = (n) => { let s = 0; for (let i = 0; i < n; i++) s += Number(c[i]) * (n + 1 - i); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
  return dv(9) === Number(c[9]) && dv(10) === Number(c[10]);
}
const emailDoCpf = (cpf) => `${cpf}@cpf.stma.invalid`;
function campoCpf(attrs = {}) {
  const i = el("input", { type: "text", inputmode: "numeric", autocomplete: "username", placeholder: "000.000.000-00", maxlength: "14", required: true, ...attrs });
  i.addEventListener("input", () => { i.value = fmtCpf(i.value); });
  return i;
}

/* ===== Inicialização ===== */
async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { btnSair.classList.add("oculto"); return telaEntrar(); }
  btnSair.classList.remove("oculto");
  const { data, error } = await sb.from("freq_perfis").select("id,nome,papel").eq("id", session.user.id).maybeSingle();
  if (error || !data) { tela(el("div", { class: "card" }, aviso("err", "Não foi possível carregar seu perfil. Tente novamente em instantes."))); return; }
  perfil = data;
  if (!perfil.nome && session.user.user_metadata?.nome) {
    await sb.rpc("freq_atualizar_nome", { p_nome: session.user.user_metadata.nome });
    perfil.nome = session.user.user_metadata.nome;
  }
  const pendente = sessaoGet("freq_checkin");

function telaEntrar(modo = "entrar", msg = null) {
  const temCheckin = !!sessaoGet("freq_checkin");
  const abas = el("div", { class: "abas" },
    el("button", { type: "button", class: modo !== "criar" ? "on" : "", onclick: () => telaEntrar("entrar") }, "Entrar"),
    el("button", { type: "button", class: modo === "criar" ? "on" : "", onclick: () => telaEntrar("criar") }, "Criar conta"));
  const nome = el("input", { type: "text", autocomplete: "name", required: true, placeholder: "Seu nome completo" });
  const cpf = campoCpf();
  const senha = el("input", { type: "password", autocomplete: modo === "criar" ? "new-password" : "current-password", required: true, minlength: "6", placeholder: "Mínimo de 6 caracteres" });
  const senha2 = el("input", { type: "password", autocomplete: "new-password", required: true, minlength: "6", placeholder: "Repita a senha" });
  const caixaMsg = el("div");
  if (msg) caixaMsg.append(msg);
  const botao = el("button", { class: "btn full", type: "submit" }, modo === "criar" ? "Criar minha conta" : "Entrar");

  const form = el("form", { onsubmit: async (e) => {
    e.preventDefault();
    botao.disabled = true; caixaMsg.replaceChildren();
    try {
      if (modo === "criar") {
        const n = nome.value.trim().replace(/\s+/g, " ");
        const c = soDigitos(cpf.value);
        if (n.length < 5 || !n.includes(" ")) throw new Error("Digite seu nome completo (nome e sobrenome).");
        if (!cpfValido(c)) throw new Error("CPF inválido. Confira os números.");
        if (senha.value.length < 6) throw new Error("A senha precisa ter pelo menos 6 caracteres.");
        if (senha.value !== senha2.value) throw new Error("As duas senhas não são iguais.");
        const { data, error } = await sb.functions.invoke("freq-contas", { body: { acao: "cadastrar", nome: n, cpf: c, senha: senha.value } });
        if (error) throw new Error("Não foi possível criar a conta agora. Verifique a internet e tente de novo.");
        if (!data?.ok) throw new Error(data?.mensagem || "Não foi possível criar a conta.");
        const { error: e2 } = await sb.auth.signInWithPassword({ email: emailDoCpf(c), password: senha.value });
        if (e2) throw e2;
      } else {
        const c = soDigitos(cpf.value);
        if (c.length !== 11) throw new Error("Digite os 11 números do CPF.");
        const { error } = await sb.auth.signInWithPassword({ email: emailDoCpf(c), password: senha.value });
        if (error) throw error;
      }
      iniciar();
    } catch (err) {
      caixaMsg.replaceChildren(aviso("err", traduzirErro(err, modo)));
      botao.disabled = false;
    }
  } },
    modo === "criar" ? [el("label", {}, "Nome completo"), nome] : null,
    el("label", {}, "CPF"), cpf,
    el("label", {}, "Senha"), senha,
    modo === "criar" ? [el("label", {}, "Confirme a senha"), senha2] : null,
    caixaMsg, botao,
    modo !== "criar" ? el("p", { class: "small muted", style: "margin-top:16px;text-align:center" },
      "Esqueceu a senha? Fale com o professor ou com a secretaria, que podem cadastrar uma nova para você.") : null,
    null);

  tela(
    temCheckin ? aviso("warn", "Para confirmar sua presença, entre na sua conta. Depois escaneie de novo o QR code da tela, porque ele muda a cada 20 segundos.") : null,
    el("div", { class: "card" },
      el("img", { class: "logo-grande", src: LOGO, alt: "Seminário Teológico Maranata" }),
      el("h1", { style: "text-align:center" }, modo === "criar" ? "Crie sua conta" : "Bem-vindo"),
      el("p", { class: "muted", style: "text-align:center" }, modo === "criar" ? "Use o seu próprio celular: a conta fica vinculada a ele na primeira presença." : "Entre para confirmar presença e ver sua frequência."),
      abas, form));
}

function traduzirErro(err, modo) {
  const m = (err && err.message) || String(err);
  if (/Invalid login credentials/i.test(m)) return "CPF ou senha incorretos. Se ainda não tem conta, use a aba Criar conta.";
  if (/rate limit|security purposes|too many/i.test(m)) return "Muitas tentativas seguidas. Aguarde um minuto e tente de novo.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Sem conexão com a internet. Tente de novo.";
  return m;
}

async function abaFrequenciaAluno() {
  const [{ data: aulas }, { data: pres }, discs] = await Promise.all([
    sb.from("freq_aulas").select("id,disciplina,disciplina_id,titulo,data").order("data", { ascending: false }).order("iniciada_em", { ascending: false }),
    sb.from("freq_presencas").select("aula_id,registrada_em,manual").eq("aluno_id", perfil.id),
    carregarDisciplinas()
  ]);
  const mapa = mapaDisciplinas(discs);
  const presentes = new Map((pres || []).map(p => [p.aula_id, p]));
  const grupos = new Map();
  for (const a of aulas || []) {
    const k = chaveAula(a);
    if (!grupos.has(k)) grupos.set(k, { chave: k, total: 0, presente: 0, ultima: a.data });
    const g = grupos.get(k); g.total++; if (presentes.has(a.id)) g.presente++;
  }
  // Conta só as disciplinas que o aluno cursou (pelo menos uma presença)
  const cursadas = [...grupos.values()].filter(g => g.presente > 0);

      el("p", { class: "muted" }, "Para confirmar presença, abra a câmera do seu celular e aponte para o QR code que o professor mostra na sala. Abra o link que aparecer."),
      aviso("warn", "Use sempre este mesmo celular e este mesmo navegador. Sua conta fica vinculada a ele.")),
    cursadas.length ? el("div", { class: "resumo" },
      el("div", { class: "resumo-box " + corPct(geral) }, el("span", {}, "Frequência geral"), el("b", {}, geral + "%"), el("small", {}, `mínimo exigido: ${FREQ_MINIMA}%`)),
      el("div", { class: "resumo-box" }, el("span", {}, "Aulas assistidas"), el("b", {}, totalPres), el("small", {}, `de ${totalAulas} aulas`)),
      el("div", { class: "resumo-box" + (abaixo ? " baixo" : "") }, el("span", {}, "Disciplinas cursadas"), el("b", {}, cursadas.length),
        el("small", {}, abaixo ? `${abaixo} abaixo do mínimo` : "todas acima do mínimo"))) : null,
    el("div", { class: "card" }, el("h2", {}, "Frequência por disciplina"),
      cursadas.length ? el("div", { class: "grade" }, cursadas.map(g => {
        const pct = Math.round(100 * g.presente / g.total);
        const d = mapa.get(g.chave);
        return el("div", { class: "stat " + corPct(pct) },
          el("span", { class: "small muted" }, d ? d.nome : nomeDaChave(g.chave, mapa, aulas)),
          d ? el("span", { class: "small muted" }, quando(d)) : null,
          el("b", {}, pct + "%"),
          el("span", { class: "small muted" }, `${g.presente} de ${g.total} aulas`),
          el("div", { class: "barra" }, el("i", { style: `width:${pct}%` }), el("u", { style: `left:${FREQ_MINIMA}%`, title: `Mínimo de ${FREQ_MINIMA}%` })),
          el("span", { class: "selo-freq" }, pct >= FREQ_MINIMA ? "Acima do mínimo" : `Abaixo de ${FREQ_MINIMA}%`));
      })) : el("p", { class: "muted" }, "Você ainda não tem presenças registradas.")),
    el("div", { class: "card" }, el("h2", {}, "Histórico de aulas"),
      aulasAluno.length
        ? el("ul", { class: "lista" }, aulasAluno.map(a => {
            const p = presentes.get(a.id);
            return el("li", {}, el("div", {}, el("div", {}, a.disciplina + (a.titulo ? " · " + a.titulo : "")), el("div", { class: "small muted" }, fmtData(a.data))),

          }))
        : el("p", { class: "muted" }, "Nada por aqui ainda."))
  ];
}

/* ===== Janelas (modais) ===== */
function confirmar({ titulo, texto, detalhe, botaoOk = "Confirmar", perigo = false, soOk = false }) {
  return new Promise((resolve) => {
    const fechar = (r) => { document.removeEventListener("keydown", tecla); fundo.remove(); resolve(r); };
    const tecla = (e) => { if (e.key === "Escape") fechar(false); };
    const ok = el("button", { class: "btn " + (perigo ? "vermelho" : ""), type: "button", onclick: () => fechar(true) }, botaoOk);
    const cancelar = soOk ? null : el("button", { class: "btn sec", type: "button", onclick: () => fechar(false) }, "Cancelar");
    const fundo = el("div", { class: "modal-fundo", onclick: (e) => { if (e.target === fundo) fechar(false); } },
      el("div", { class: "modal", role: "alertdialog", "aria-modal": "true" },
        perigo ? el("div", { class: "modal-icone" }, "!") : null,
        el("h2", {}, titulo),
        texto ? el("p", {}, texto) : null,
        detalhe ? el("div", { class: "modal-detalhe" }, detalhe) : null,
        el("div", { class: "modal-botoes" }, cancelar, ok)));
    document.addEventListener("keydown", tecla);
    document.body.append(fundo);
    (cancelar || ok).focus();
  });
}
function janela(titulo, ...conteudo) {
  const fechar = () => { document.removeEventListener("keydown", tecla); fundo.remove(); fundo.dispatchEvent(new Event("fechou")); };
  const tecla = (e) => { if (e.key === "Escape" && document.querySelectorAll(".modal-fundo").length === 1) fechar(); };
  const corpo = el("div", { class: "janela-corpo" }, ...conteudo);
  const fundo = el("div", { class: "modal-fundo", onclick: (e) => { if (e.target === fundo) fechar(); } },
    el("div", { class: "modal largo", role: "dialog", "aria-modal": "true" },
      el("div", { class: "janela-topo" }, el("h2", {}, titulo), el("button", { class: "fechar", type: "button", "aria-label": "Fechar", onclick: fechar }, "×")),
      corpo));
  document.addEventListener("keydown", tecla);
  document.body.append(fundo);
  return { fundo, corpo, fechar };
}
async function erroModal(msg) { await confirmar({ titulo: "Não foi possível concluir", texto: msg, botaoOk: "Ok", soOk: true }); }

/* ===== Presença manual ===== */
async function abrirPresencas(aula, aoMudar) {

    el("div", { class: "modal-detalhe" }, nomeAula + (aula.data ? " — " + fmtData(aula.data) : "")),
    busca, contador, lista);
  let alunos = [], pres = new Map();
  async function carregar() {
    const [{ data: a }, { data: p }] = await Promise.all([
      sb.from("freq_perfis").select("id,nome,cpf").eq("papel", "aluno").order("nome"),
      sb.from("freq_presencas").select("aluno_id,manual,registrada_em").eq("aula_id", aula.id)
    ]);
    alunos = a || []; pres = new Map((p || []).map(x => [x.aluno_id, x]));

    const q = busca.value.trim().toLowerCase(); const qd = soDigitos(q);

    contador.textContent = `${pres.size} presente(s) de ${alunos.length} aluno(s) cadastrados`;
    lista.replaceChildren(...(filtrados.length ? filtrados.map(a => {
      const p = pres.get(a.id);
      return el("li", {},
        el("div", {}, el("div", {}, a.nome || "(sem nome)"),
          el("div", { class: "small muted" }, p ? `Presente · ${p.manual ? "registro manual" : "QR code"} · ${fmtHora(p.registrada_em)}` : (a.cpf ? "CPF " + fmtCpf(a.cpf) : ""))),
        p ? el("button", { class: "btn perigo mini", type: "button", onclick: async (e) => {
              const sim = await confirmar({ titulo: "Remover esta presença?", texto: `${a.nome} passará a constar como falta nesta aula.`, detalhe: nomeAula, botaoOk: "Sim, remover", perigo: true });
              if (!sim) return;
              e.currentTarget.disabled = true;
              const { error } = await sb.rpc("freq_desmarcar_presenca", { p_aula: aula.id, p_aluno: a.id });
              if (error) { await erroModal(error.message); }
              await carregar(); aoMudar && aoMudar();
            } }, "Remover")
          : el("button", { class: "btn mini", type: "button", onclick: async (e) => {
              e.currentTarget.disabled = true;
              const { error } = await sb.rpc("freq_marcar_presenca", { p_aula: aula.id, p_aluno: a.id });
              if (error) { await erroModal(error.message); }
              await carregar(); aoMudar && aoMudar();
            } }, "Marcar presença"));
    }) : [el("li", {}, el("span", { class: "muted" }, alunos.length ? "Nenhum aluno encontrado." : "Nenhum aluno cadastrado ainda."))]));
  }
  busca.addEventListener("input", desenhar);
  lista.append(el("li", {}, el("span", { class: "muted" }, "Carregando…")));
  await carregar();
  busca.focus();
}

  const n = count || 0;
  const sim = await confirmar({

/* ===== Relatório ===== */
async function abaRelatorio() {
  const [{ data: aulas }, discs] = await Promise.all([
    sb.from("freq_aulas").select("id,disciplina,disciplina_id,titulo,data").order("data").order("iniciada_em"),
    carregarDisciplinas()
  ]);
  const mapa = mapaDisciplinas(discs);
  const chaves = [...new Set((aulas || []).map(chaveAula))];
  if (!chaves.length) return [el("div", { class: "card" }, el("h1", {}, "Relatório de frequência"), el("p", { class: "muted" }, "Ainda não há aulas para gerar relatório."))];
  // Mais recentes primeiro
  chaves.sort((x, y) => {
    const ux = aulas.filter(a => chaveAula(a) === x).at(-1).data, uy = aulas.filter(a => chaveAula(a) === y).at(-1).data;
    return uy.localeCompare(ux);
  });
  const sel = el("select", {}, chaves.map(k => el("option", { value: k }, nomeDaChave(k, mapa, aulas))));
  const area = el("div");
  async function montar() {
    const daDisc = aulas.filter(a => chaveAula(a) === sel.value);
    const ids = daDisc.map(a => a.id);
    const [{ data: pres }, { data: alunos }] = await Promise.all([
      sb.from("freq_presencas").select("aula_id,aluno_id,manual").in("aula_id", ids),
      sb.from("freq_perfis").select("id,nome").eq("papel", "aluno").order("nome")
    ]);
    const marcasMap = new Map((pres || []).map(p => [p.aula_id + "|" + p.aluno_id, p]));
    const comPresenca = new Set((pres || []).map(p => p.aluno_id));
    const lista = (alunos || []).filter(a => comPresenca.has(a.id));
    if (!lista.length) { area.replaceChildren(el("p", { class: "muted" }, "Nenhuma presença registrada nesta disciplina.")); return; }
    const linhas = lista.map(al => {
      const marcas = daDisc.map(a => marcasMap.get(a.id + "|" + al.id) || null);
      const n = marcas.filter(Boolean).length;
      return { nome: al.nome || "(sem nome)", marcas, n, pct: Math.round(100 * n / daDisc.length) };
    });
    const abaixo = linhas.filter(l => l.pct < FREQ_MINIMA).length;
    const tabela = el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "Aluno"), daDisc.map((a, i) => el("th", { title: a.titulo || "" }, `A${i + 1}`, el("br"), fmtData(a.data).slice(0, 5))), el("th", {}, "Freq."))),
      el("tbody", {}, linhas.map(l => el("tr", {}, el("td", {}, l.nome),
        l.marcas.map(m => el("td", { class: m ? "p" : "f", title: m?.manual ? "Presença manual" : "" }, m ? (m.manual ? "P*" : "P") : "F")),
        el("td", { class: l.pct < FREQ_MINIMA ? "pct-baixo" : "pct-bom" }, el("b", {}, l.pct + "%"))))));
    const csv = () => {
      const cab = ["Aluno", ...daDisc.map((a, i) => `A${i + 1} ${fmtData(a.data)}`), "Presenças", "Frequência", "Situação"];
      const corpo = linhas.map(l => [l.nome, ...l.marcas.map(m => m ? "P" : "F"), l.n, l.pct + "%", l.pct >= FREQ_MINIMA ? "Acima do mínimo" : "Abaixo do mínimo"]);
      const txt = [cab, ...corpo].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(";")).join("\r\n");
      const a = el("a", { href: URL.createObjectURL(new Blob(["﻿" + txt], { type: "text/csv;charset=utf-8" })), download: `frequencia-${nomeDaChave(sel.value, mapa, aulas).replace(/[^\w\-À-ú ]+/g, "")}.csv` });
      document.body.append(a); a.click(); a.remove();
    };
    area.replaceChildren(
      el("p", { class: "small muted" }, `${daDisc.length} aula(s) · ${lista.length} aluno(s) · P = presente, P* = presença manual, F = falta`),
      abaixo ? aviso("warn", `${abaixo} aluno(s) abaixo da frequência mínima de ${FREQ_MINIMA}%.`) : null,
      el("div", { class: "tabela-wrap" }, tabela),
      el("button", { class: "btn sec", type: "button", style: "margin-top:16px", onclick: csv }, "Baixar planilha (CSV)"));
  }
  sel.addEventListener("change", montar);
  await montar();
  return [el("div", { class: "card" }, el("h1", {}, "Relatório de frequência"), el("label", {}, "Disciplina"), sel, el("div", { style: "margin-top:16px" }, area))];
}

/* ===== Pix do seminário ===== */
const TIPOS_PIX = ["Celular", "CPF", "CNPJ", "E-mail", "Chave aleatória"];
async function carregarPix() {
  const { data } = await sb.from("freq_config").select("valor").eq("chave", "pix").maybeSingle();
  return data?.valor || null;
}
function fmtCelular(d) {
  d = soDigitos(d).replace(/^55(?=\d{10,11}$)/, "");
  if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return d;
}
function fmtCnpj(d) { d = soDigitos(d); return d.length === 14 ? d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5") : d; }
function chaveExibir(p) {
  if (p.tipo === "Celular") return fmtCelular(p.chave);
  if (p.tipo === "CPF") return fmtCpf(p.chave);
  if (p.tipo === "CNPJ") return fmtCnpj(p.chave);
  return p.chave;
}
function chaveCopiar(p) {
  if (p.tipo === "Celular") return soDigitos(p.chave).replace(/^55(?=\d{10,11}$)/, "");
  if (p.tipo === "CPF" || p.tipo === "CNPJ") return soDigitos(p.chave);
  return String(p.chave).trim();
}
function chavePayload(p) {
  if (p.tipo === "Celular") { const d = soDigitos(p.chave).replace(/^55(?=\d{10,11}$)/, ""); return d.length >= 10 ? "+55" + d : null; }
  if (p.tipo === "CPF" || p.tipo === "CNPJ") return soDigitos(p.chave);
  if (p.tipo === "E-mail") return String(p.chave).trim().toLowerCase();
  return String(p.chave).trim().toLowerCase();
}
// Gera o código "Pix copia e cola" (BR Code estático, sem valor definido)
function tlv(id, v) { return id + String(v.length).padStart(2, "0") + v; }
function crc16(s) {
  let c = 0xFFFF;
  for (const b of new TextEncoder().encode(s)) {
    c ^= b << 8;
    for (let i = 0; i < 8; i++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF;
  }
  return c.toString(16).toUpperCase().padStart(4, "0");
}
function textoBRCode(s, max) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/[^A-Z0-9 ]/g, "").replace(/\s+/g, " ").trim().slice(0, max); }
function pixCopiaECola(p) {
  const chave = chavePayload(p);
  if (!chave) return null;
  const conta = tlv("00", "br.gov.bcb.pix") + tlv("01", chave);
  const s = tlv("00", "01") + tlv("26", conta) + tlv("52", "0000") + tlv("53", "986") + tlv("58", "BR") +
    tlv("59", textoBRCode(p.titular, 25) || "STMA") + tlv("60", textoBRCode(p.cidade || "SAO LUIS", 15) || "SAO LUIS") +
    tlv("62", tlv("05", "***")) + "6304";
  return s + crc16(s);
}
async function copiar(texto, botao) {
  let ok = false;
  try { await navigator.clipboard.writeText(texto); ok = true; }
  catch {
    const t = el("textarea", { style: "position:fixed;top:0;opacity:0" }); t.value = texto; document.body.append(t); t.select();
    try { ok = document.execCommand("copy"); } catch {} t.remove();
  }
  const orig = botao.dataset.rotulo || (botao.dataset.rotulo = botao.textContent);
  botao.textContent = ok ? "Copiado ✓" : "Não foi possível copiar";
  botao.classList.toggle("copiado", ok);
  setTimeout(() => { botao.textContent = orig; botao.classList.remove("copiado"); }, 2200);
}
function cartaoPix(p) {
  if (!p || !p.chave) return el("div", { class: "card" }, el("h1", {}, "Pix do seminário"), el("p", { class: "muted" }, "Os dados do Pix ainda não foram cadastrados."));
  return el("div", { class: "card pix-card" },
    el("div", { class: "pix-topo" }, el("span", { class: "pix-selo" }, "Pix do STMA"), el("img", { src: LOGO, alt: "STMA", class: "pix-logo" })),
    el("div", { class: "pix-rotulo" }, "Titular"),
    el("div", { class: "pix-titular" }, p.titular || "—"),
    p.banco ? [el("div", { class: "pix-rotulo" }, "Banco"), el("div", { class: "pix-banco" }, p.banco)] : null,
    el("div", { class: "pix-chave" },
      el("div", { class: "pix-rotulo" }, "Chave Pix · " + (p.tipo || "")),
      el("div", { class: "pix-num" }, chaveExibir(p))),
    el("button", { class: "btn full", type: "button", onclick: (e) => copiar(chaveCopiar(p), e.currentTarget) }, "Copiar chave Pix"),
    el("p", { class: "small muted", style: "margin:14px 0 0" }, "No app do seu banco, escolha Pix → Pagar com chave, cole a chave e digite o valor. Confira o nome do titular antes de confirmar."),
    p.observacao ? aviso("warn", p.observacao) : null);
}
async function abaPixLeitura() {
  return [cartaoPix(await carregarPix())];
}
async function abaPixProfessor() {
  const p = (await carregarPix()) || {};
  const titular = el("input", { type: "text", required: true, value: p.titular || "" });
  const tipo = el("select", {}, TIPOS_PIX.map(t => el("option", { value: t, selected: (p.tipo || "Celular") === t }, t)));
  const chave = el("input", { type: "text", required: true, value: p.chave ? chaveExibir(p) : "" });
  const banco = el("input", { type: "text", placeholder: "Opcional. Ex.: Banco do Brasil", value: p.banco || "" });
  const cidade = el("input", { type: "text", placeholder: "SAO LUIS", value: p.cidade || "SAO LUIS" });
  const obs = el("input", { type: "text", placeholder: "Opcional. Ex.: envie o comprovante para…", value: p.observacao || "" });
  const caixa = el("div");
  const botao = el("button", { class: "btn full", type: "submit" }, "Salvar dados do Pix");
  return [
    el("div", { class: "card" }, el("h2", {}, "Como os alunos veem"), el("p", { class: "small muted" }, "Os alunos encontram estes dados na aba “Pix do seminário”."), cartaoPix(p.chave ? p : null)),
    el("div", { class: "card" }, el("h1", {}, "Editar dados do Pix"),
      el("form", { onsubmit: async (e) => {
        e.preventDefault();
        let c = chave.value.trim();
        if (["Celular", "CPF", "CNPJ"].includes(tipo.value)) c = soDigitos(c);
        if (tipo.value === "Celular" && !/^\d{10,11}$/.test(c.replace(/^55(?=\d{10,11}$)/, ""))) return caixa.replaceChildren(aviso("err", "Digite o celular com DDD. Ex.: (98) 99114-0602"));
        if (tipo.value === "CPF" && !cpfValido(c)) return caixa.replaceChildren(aviso("err", "CPF da chave inválido."));
        if (tipo.value === "CNPJ" && c.length !== 14) return caixa.replaceChildren(aviso("err", "O CNPJ precisa ter 14 números."));
        if (tipo.value === "E-mail" && !/^\S+@\S+\.\S+$/.test(c)) return caixa.replaceChildren(aviso("err", "E-mail da chave inválido."));
        botao.disabled = true;
        const valor = { titular: titular.value.trim(), tipo: tipo.value, chave: c, banco: banco.value.trim(), cidade: cidade.value.trim() || "SAO LUIS", observacao: obs.value.trim() };
        const { error } = await sb.rpc("freq_salvar_pix", { p_valor: valor });
        if (error) { caixa.replaceChildren(aviso("err", error.message)); botao.disabled = false; return; }
        telaProfessor("pix");
      } },
        el("label", {}, "Titular da conta"), titular,
        el("label", {}, "Tipo de chave"), tipo,
        el("label", {}, "Chave Pix"), chave,
        el("label", {}, "Banco"), banco,
        el("label", {}, "Cidade do titular"), cidade,
        el("label", {}, "Recado para os alunos"), obs,
        caixa, botao))
  ];
}

/* ===== Aula ao vivo: QR rotativo ===== */
function telaAoVivo(aula) {
  if (pararAoVivo) pararAoVivo();
  const qr = el("div", { id: "qr" });
  const barra = el("i", { style: "width:100%" });
  const numero = el("div", { class: "numero" }, "0");
  const nomes = el("ul");
  const status = el("div", { class: "small", style: "opacity:.75;margin-top:8px" });
  let tokenAtual = null, expira = 0, ativo = true, timer, tick;

  const sairTela = () => { pararAoVivo && pararAoVivo(); document.exitFullscreen?.().catch(() => {}); telaProfessor("aulas"); };
  const raiz = el("div", { class: "ao-vivo-tela" },
    el("header", {},
      el("div", {}, el("div", { class: "rotulo" }, "Confirme sua presença"),
        el("h1", {}, aula.disciplina + (aula.titulo ? " · " + aula.titulo : ""))),
      el("div", { style: "display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end" },
        el("button", { class: "btn sec", type: "button", onclick: () => { try { const p = document.fullscreenElement ? document.exitFullscreen() : raiz.requestFullscreen?.(); p?.catch?.(() => {}); } catch {} } }, "Tela cheia"),
        el("button", { class: "btn sec", type: "button", onclick: () => abrirPresencas(aula) }, "Presença manual"),
        el("button", { class: "btn sec", type: "button", onclick: sairTela }, "Voltar"),
        el("button", { class: "btn", style: "background:#fff;color:var(--err)", type: "button", onclick: async () => {
          const sim = await confirmar({ titulo: "Encerrar a aula?", texto: "Depois disso ninguém mais consegue confirmar presença pelo QR code. A presença manual continua disponível em Aulas recentes.", botaoOk: "Sim, encerrar", perigo: true });
          if (!sim) return;
          await sb.rpc("freq_encerrar_aula", { p_aula: aula.id }); sairTela();
        } }, "Encerrar aula"))),
    el("div", { class: "corpo" },
      el("div", { class: "qr-box" }, el("img", { class: "logo-qr", src: LOGO, alt: "STMA" }), qr, el("div", { class: "contagem" }, barra),
        el("div", { class: "instrucao" }, "Aponte a câmera do celular para o código")),
      el("div", { class: "painel" }, el("div", { class: "small", style: "opacity:.7" }, "Presentes"), numero, nomes, status)));
  document.body.append(raiz);

  function desenharQR(token) {
    const url = `${location.origin}${location.pathname}?aula=${encodeURIComponent(aula.id)}&t=${encodeURIComponent(token)}`;
    const q = qrcode(0, "M"); q.addData(url); q.make();
    qr.innerHTML = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
  }
  async function atualizar() {
    if (!ativo) return;
    const { data, error } = await sb.rpc("freq_token_atual", { p_aula: aula.id });
    if (error) {
      if (/encerrada/i.test(error.message)) { status.textContent = "Aula encerrada."; ativo = false; return; }
      status.textContent = "Sem conexão. Tentando de novo…";
    } else {
      status.textContent = "";
      if (data.token !== tokenAtual) { tokenAtual = data.token; desenharQR(tokenAtual); }
      expira = new Date(data.expira_em).getTime();
    }
    const { data: pres } = await sb.from("freq_presencas").select("aluno_id,registrada_em,manual,freq_perfis!freq_presencas_aluno_id_fkey(nome)").eq("aula_id", aula.id).order("registrada_em", { ascending: false });
    if (pres) {
      numero.textContent = pres.length;
      nomes.replaceChildren(...pres.map(p => el("li", {}, (p.freq_perfis?.nome || "Aluno") + " · " + fmtHora(p.registrada_em) + (p.manual ? " · manual" : ""))));
    }
    timer = setTimeout(atualizar, 4000);
  }
  tick = setInterval(() => {
    const resta = Math.max(0, expira - Date.now());
    barra.style.width = Math.min(100, resta / 200) + "%";
  }, 250);
  atualizar();
  pararAoVivo = () => { ativo = false; clearTimeout(timer); clearInterval(tick); raiz.remove(); pararAoVivo = null; };
}

iniciar();
</script>
